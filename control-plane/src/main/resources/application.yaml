# control-plane configuration. Holds NO secrets.
# Database, Redis and port come from environment variables (deploy/.env):
#   SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD  -> spring.datasource.*
#   SPRING_DATA_REDIS_URL                          -> spring.data.redis.url
#   SERVER_PORT                                    -> server.port
spring:
  application:
    name: control-plane
  flyway:
    schemas: flags          # Flyway creates schema "flags" if it is missing
    default-schema: flags   # and keeps its history table (flyway_schema_history) there
  mvc:
    problemdetails:
      enabled: true         # errors (404, 409, 400) return an RFC 9457 ProblemDetail JSON body

server:
  port: 8081                # default only; SERVER_PORT overrides it